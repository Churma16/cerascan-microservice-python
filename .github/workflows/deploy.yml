name: Deploy Python Microservice

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "app.py,grpc_server.py,ceramic.proto,ceramic_pb2.py,ceramic_pb2_grpc.py,Dockerfile,requirements.txt"
          target: "/root/ceramic-scanner/python-service"

      - name: Restart Python Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/ceramic-scanner
            docker compose up -d --build --no-deps --force-recreate python-worker
